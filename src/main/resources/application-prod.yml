spring:
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&gssEncMode=disable
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    cache: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

logging:
  level:
    root: INFO
    com.cryptodrop: INFO
    org.springframework.security: WARN

app:
  jwt:
    cookie-secure: true
    secret: ${JWT_SECRET:prod-set-JWT_SECRET-to-a-long-random-string}

oxapay:
  enabled: ${OXAPAY_ENABLED:true}
  sandbox-enabled: ${OXAPAY_SANDBOX_ENABLED:false}
  sandbox-merchant: ${OXAPAY_SANDBOX_MERCHANT:sandbox}
  base-url: ${OXAPAY_BASE_URL:https://api.oxapay.com}
  merchant-api-key: ${OXAPAY_MERCHANT_API_KEY:0TQI2K-U2LCTH-CHX6KK-VHZWVZ}
  payout-api-key: ${OXAPAY_PAYOUT_API_KEY:YEFJBD-KW4FQ2-I680BB-DTDRFM}
  callback-url: ${OXAPAY_CALLBACK_URL:https://article-aolc.onrender.com/api/checkout/oxapay/callback}
  return-url: ${OXAPAY_RETURN_URL:https://article-aolc.onrender.com/orders}
  invoice-lifetime-minutes: ${OXAPAY_INVOICE_LIFETIME_MINUTES:30}
  currency: ${OXAPAY_CURRENCY:USD}
  payout-currency: ${OXAPAY_PAYOUT_CURRENCY:USDT}
  payout-network: "${OXAPAY_PAYOUT_NETWORK:Binance Smart Chain}"
