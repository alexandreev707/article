<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/layout}">
<head>
    <title>Sign In - Marketplace</title>
</head>
<body>
    <div th:fragment="content">
        <div class="container py-12">
            <div class="max-w-md mx-auto">
                <div class="card p-8 shadow-xl">
                    <!-- Header -->
                    <div class="text-center mb-8">
                        <div class="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-full mb-4">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <h1 class="text-3xl font-bold text-gray-900 mb-2">Sign in</h1>
                        <p class="text-gray-600">Sign in to your account</p>
                    </div>

                    <!-- Form -->
                    <form th:action="@{/login}" method="post" class="space-y-6">
                        <div>
                            <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                                Username
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                    </svg>
                                </div>
                                <input type="text"
                                       id="username"
                                       name="username"
                                       required
                                       class="form-input pl-10"
                                       placeholder="Enter username"
                                       autocomplete="username">
                            </div>
                        </div>

                        <div>
                            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                                Password
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                                    </svg>
                                </div>
                                <input type="password"
                                       id="password"
                                       name="password"
                                       required
                                       class="form-input pl-10"
                                       placeholder="Enter password"
                                       autocomplete="current-password">
                            </div>
                        </div>

                        <div th:if="${param.error}" class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded-lg">
                            <div class="flex items-center">
                                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                                </svg>
                                <span class="font-medium">Invalid username or password</span>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary w-full py-3 text-base font-semibold">
                            Sign in
                        </button>
                    </form>

                    <!-- Social sign-in (before test credentials) -->
                    <div th:if="${oauth2GoogleEnabled or oauth2FacebookEnabled}" class="mt-8">
                        <div class="relative mb-5">
                            <div class="absolute inset-0 flex items-center" aria-hidden="true">
                                <div class="w-full border-t border-gray-200"></div>
                            </div>
                            <div class="relative flex justify-center text-xs">
                                <span class="bg-white px-3 font-medium text-gray-500">Or sign in with</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-3">
                            <a th:if="${oauth2GoogleEnabled}"
                               th:href="@{/oauth2/authorization/google}"
                               class="flex w-full items-center justify-center gap-3 rounded-xl border border-gray-200 bg-white py-3.5 text-sm font-semibold text-gray-800 shadow-sm transition hover:border-gray-300 hover:bg-gray-50 hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
                               aria-label="Sign in with Google">
                                <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
                                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                <span>Continue with Google</span>
                            </a>
                            <a th:if="${oauth2FacebookEnabled}"
                               th:href="@{/oauth2/authorization/facebook}"
                               class="flex w-full items-center justify-center gap-3 rounded-xl border border-[#1877F2]/30 bg-[#1877F2] py-3.5 text-sm font-semibold text-white shadow-sm shadow-blue-500/20 transition hover:bg-[#166FE5] hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-[#1877F2] focus-visible:ring-offset-2"
                               aria-label="Sign in with Facebook">
                                <svg class="h-5 w-5 shrink-0 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                                </svg>
                                <span>Continue with Facebook</span>
                            </a>
                        </div>
                    </div>

                    <!-- Test Users Info -->
                    <div class="mt-8 p-5 bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl border border-blue-200">
                        <p class="text-sm font-semibold text-primary mb-3 flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                            </svg>
                            Test users:
                        </p>
                        <ul class="text-sm text-gray-700 space-y-2">
                            <li class="flex items-center">
                                <span class="inline-block w-2 h-2 bg-green-500 rounded-full mr-2"></span>
                                <strong class="font-semibold">customer</strong> / password <span class="text-gray-500">(Customer)</span>
                            </li>
                            <li class="flex items-center">
                                <span class="inline-block w-2 h-2 bg-blue-500 rounded-full mr-2"></span>
                                <strong class="font-semibold">seller</strong> / password <span class="text-gray-500">(Seller)</span>
                            </li>
                            <li class="flex items-center">
                                <span class="inline-block w-2 h-2 bg-purple-500 rounded-full mr-2"></span>
                                <strong class="font-semibold">admin</strong> / password <span class="text-gray-500">(Administrator)</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <script th:inline="javascript">
            (function () {
                fetch(/*[[@{/api/auth/session}]]*/ '/api/auth/session', { credentials: 'same-origin' })
                    .then(function (r) {
                        if (r.ok) {
                            window.location.href = /*[[@{/}]]*/ '/';
                        }
                    })
                    .catch(function () { /* stay on login */ });
            })();
        </script>
    </div>
</body>
</html>
